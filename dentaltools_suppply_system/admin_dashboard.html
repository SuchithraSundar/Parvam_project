<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dental Tool System</title>
    <link rel="stylesheet" href="admin_styles.css">
</head>

<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="logo">
                <h2>Dental Tool System</h2>
            </div>
            <ul class="nav-links">
                <li class="active" data-tab="users"><span>Manage Users</span></li>
                <li data-tab="inventory"><span>Inventory Management</span></li>
                <li data-tab="notes"><span>Notes</span></li>
                <li class="logout"><span>Logout</span></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Admin Dashboard</h1>
                <div class="admin-info">
                    <span class="admin-name">Admin</span>
                </div>
            </div>

            <div class="content-section active" id="users-section">
                <h2>User Management</h2>
                <div class="search-bar">
                    <input type="text" id="user-search" placeholder="Search users...">
                </div>
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <!-- User data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div class="content-section" id="inventory-section">
                <h2>Inventory Management</h2>
                <div class="inventory-controls">
                    <button id="add-item-btn" class="btn">Add New Item</button>
                    <div class="search-bar">
                        <input type="text" id="inventory-search" placeholder="Search inventory...">
                    </div>
                </div>
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list">
                        <!-- Inventory data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div class="content-section" id="notes-section">
                <h2>Notes</h2>
                <div class="notes-container">
                    <div class="add-note">
                        <h3>Add New Note</h3>
                        <textarea id="new-note" placeholder="Write your note here..."></textarea>
                        <button id="save-note" class="btn">Save Note</button>
                    </div>
                    <div class="notes-list" id="notes-list">
                        <!-- Notes will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal" id="add-item-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Add New Item</h2>
            <form id="add-item-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" required>
                </div>
                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" required>
                        <option value="">Select Category</option>
                        <option value="tools">Tools</option>
                        <option value="supplies">Supplies</option>
                        <option value="equipment">Equipment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="item-quantity">Quantity</label>
                    <input type="number" id="item-quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label for="item-price">Price</label>
                    <input type="number" id="item-price" min="0" step="0.01" required>
                </div>
                <button type="submit" class="btn">Add Item</button>
            </form>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>

</html>
